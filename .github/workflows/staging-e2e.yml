# Runs the Milestone 1 journey against the live staging site after each successful Vercel production deploy,
# using the real AI provider configured in Vercel. Can also be started by hand with a URL.
name: Staging end-to-end
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url: { description: 'Staging URL (https://…)', required: true }
jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ github.event.inputs.url || github.event.deployment_status.environment_url }}
      E2E_REAL_AI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Domain and HTTPS check
        run: |
          host=$(echo "$E2E_BASE_URL" | sed -E 's#https?://##; s#/.*##')
          echo "== https://$host"; curl -sSI "https://$host" | grep -iE '^(HTTP|location|strict-transport|server)' || true
          case "$host" in www.*|*.vercel.app) ;; *) echo "== https://www.$host"; curl -sSI "https://www.$host" | grep -iE '^(HTTP|location)' || true;; esac
          echo "== certificate"; echo | openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null | openssl x509 -noout -subject -issuer -enddate || true
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: test-results, retention-days: 7 }
