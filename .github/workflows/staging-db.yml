# Applies supabase/migrations (and the staging-only invite codes in seed.sql) to the STAGING Supabase project.
# Needs repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD. The staging project ref is not secret.
# Never point this at production: --include-seed would add test invite codes.
name: Staging database
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/staging-db.yml']
  workflow_dispatch:
concurrency: staging-db
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'npyxfczyoykonpomnsqt' }}  # netbyfriday-staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.122.1 }
      - name: Check configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing secret SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "$PROJECT_REF" || { echo "Missing variable SUPABASE_PROJECT_REF"; exit 1; }
      - run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - run: supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD"
